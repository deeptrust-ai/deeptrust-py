[project]
name = "deeptrust-example-livekit"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "deeptrust-ai[livekit]",
  "livekit-plugins-deepgram>=1.0",
  "livekit-plugins-openai>=1.0",
  "python-dotenv>=1.0",
  # server.py only: the token endpoint and the shared analysis router.
  "fastapi>=0.110",
  "uvicorn>=0.30",
  # The model picker in the demo UI offers all three providers, so the worker
  # needs a plugin for each one it can be asked to build.
  "livekit-plugins-anthropic>=1.0",
]

# Uses the checkout rather than the published package, so the example exercises
# the code in this repo.
[tool.uv.sources]
deeptrust-ai = { path = "../..", editable = true }
